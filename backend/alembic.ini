# Epic 1 Alembic config (Templates table).
# See docs/epic1-template-design-v1.md section 6.1 for the full rationale.
# NOTE: keep this file ASCII-only -- alembic reads alembic.ini with the locale
# encoding (GBK on this machine), so non-ASCII comments break config parsing.
# Discipline: no --autogenerate (no ORM metadata); DDL single source of truth =
# handwritten revisions under alembic/versions/.
[alembic]
# %(here)s anchors to this ini's directory (backend/) so the CLI works from any cwd
script_location = %(here)s/alembic
prepend_sys_path = %(here)s
path_separator = os
# Intentionally empty: sqlalchemy.url is resolved by alembic/env.py from
# ZHIENG_DB, so test.db / zhiheng.db always match database.py.
sqlalchemy.url =
# New revision files get a human-readable sequence prefix (0002_xxx, 0003_xxx)
file_template = %%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
